<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Garmin Golf Export</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .header .dot { color: #6cc4ee; font-size: 16px; }
    .header span { font-weight: 600; font-size: 14px; }

    .scrape-btn {
      width: 100%;
      padding: 8px 0;
      background: #6cc4ee;
      color: #111;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .scrape-btn:hover { background: #8ad2f4; }
    .scrape-btn:disabled { background: #3f3f46; color: #71717a; cursor: default; }

    .phase {
      margin-top: 12px;
      font-size: 11px;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-height: 14px;
    }

    .bar {
      margin-top: 6px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar .fill {
      height: 100%;
      width: 0%;
      background: #6cc4ee;
      border-radius: 3px;
      transition: width 0.2s;
    }

    .note {
      margin-top: 8px;
      font-size: 11px;
      color: #d4d4d8;
      line-height: 1.5;
      min-height: 16px;
      word-break: break-word;
    }

    .errors { color: #f87171; }
    .ok { color: #4ade80; }

    .prev {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .prev input {
      display: block;
      margin-top: 6px;
      width: 100%;
      font-size: 11px;
      color: #d4d4d8;
    }

    .hint {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      color: #52525b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="dot">⛳︎</span>
    <span>Garmin Golf Export</span>
  </div>

  <button class="scrape-btn" id="scrape-btn">Capture all</button>

  <label class="prev" for="prev-bundle">
    Previous bundle (optional) — makes the run incremental: only scorecards not
    already in it are fetched.
    <input type="file" id="prev-bundle" accept=".json,application/json" />
  </label>

  <div class="phase" id="phase"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="note" id="note"></div>
  <div class="note errors" id="errors"></div>

  <p class="hint">
    Log in at connect.garmin.com, then run. Sequential and polite —
    expect a few minutes on a first capture. The run keeps going if you close
    this popup; the bundle downloads when it finishes.
  </p>

  <script src="popup.js"></script>
</body>
</html>
