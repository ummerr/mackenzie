<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MACKENZIE — every course I've played</title>
<meta name="description" content="A mapped, sourced, multi-vector history of every golf course I've played.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/map.css" rel="stylesheet">
</head>
<body>

<header class="head">
  <div class="wordmark">MAC<span>KENZIE</span></div>
  <div class="head-stats" id="head-stats"></div>
</header>

<div id="map"></div>

<div class="boot" id="boot">loading courses…</div>

<aside class="regions" id="regions">
  <div class="regions-head" id="regions-head"><span>Where</span><span>—</span></div>
  <div class="region-list" id="region-list"></div>
</aside>

<div class="legend" id="legend"></div>

<div class="card" id="card"></div>

<aside class="dossier" id="dossier" aria-label="Course dossier">
  <button class="dos-close" id="dossier-close" aria-label="Close">×</button>
  <div id="dossier-content"></div>
</aside>

<nav class="rail" id="rail" aria-label="Colour the map by"></nav>

<script>
/* Surface failures instead of leaving "loading courses…" on screen forever.
   A silent boot failure is indistinguishable from a slow network. */
window.addEventListener("error", function (e) {
  var b = document.getElementById("boot");
  if (b && !b.hidden) b.textContent = (e.message || "script error") + " — " + ((e.filename || "").split("/").pop() || "?") + ":" + (e.lineno || "?");
});
window.addEventListener("unhandledrejection", function (e) {
  var b = document.getElementById("boot");
  if (b && !b.hidden) b.textContent = "unhandled: " + ((e.reason && e.reason.message) || e.reason);
});
</script>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="src/shared.js"></script>
<script src="src/panel.js"></script>
<script src="src/map.js"></script>
</body>
</html>
