<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
/* Same blocking theme stamp as app/layout.tsx, so the shared header band lands
   in the right palette on the first frame. The map below stays dark either way. */
try{var t=localStorage.getItem("theme");if(t==="dark"||t==="auto"||t==="light")document.documentElement.dataset.theme=t}catch(e){}
</script>
<title>MACKENZIE — every course I've played</title>
<meta name="description" content="A mapped, sourced, multi-vector history of every golf course I've played.">

<!-- The map's own pin, inline so the tab icon costs no request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a09'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%230a0a09' opacity='.8'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23ff6b35' stroke='%230a0a09' stroke-width='1.4'/%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:title" content="MACKENZIE — every course I've played">
<meta property="og:description" content="96 courses, 85 places, 11 states, 3 countries. Mapped, sourced, and rankable through six different lenses.">
<meta property="og:url" content="https://courses.ummerr.com/courses">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="/courses/css/map.css" rel="stylesheet">
</head>
<body>

<!-- The same masthead as every app page — markup and metrics replicate
     app/layout.tsx + app/site-nav.tsx, palette scoped in map.css. -->
<header class="site-head">
  <div class="site-head-row">
    <div class="site-head-left">
      <a class="site-wordmark" href="/">MAC<span>KENZIE</span></a>
      <nav class="site-nav" aria-label="Site">
        <a href="/">Profile</a>
        <a href="/bag">Bag</a>
        <a href="/practice">Practice</a>
        <a href="/courses" aria-current="page">Courses</a>
        <a href="/scratch">Scratch</a>
        <a href="/sessions">Sessions</a>
      </nav>
    </div>
    <button class="site-theme" id="theme-toggle" type="button" aria-label="Theme"></button>
  </div>
  <nav class="site-tabs" aria-label="Site">
    <a href="/">Profile</a>
    <a href="/bag">Bag</a>
    <a href="/practice">Practice</a>
    <a href="/courses" aria-current="page">Courses</a>
    <a href="/scratch">Scratch</a>
    <a href="/sessions">Sessions</a>
  </nav>
</header>

<div class="head-stats" id="head-stats"></div>

<div id="map"></div>

<div class="boot" id="boot">loading courses…</div>

<aside class="regions" id="regions">
  <div class="regions-head" id="regions-head"><span>Where</span><span>—</span></div>
  <div class="region-list" id="region-list"></div>
</aside>

<div class="legend" id="legend"></div>

<div class="list" id="list" aria-label="Course list"></div>

<div class="card" id="card"></div>

<aside class="dossier" id="dossier" aria-label="Course dossier">
  <button class="dos-close" id="dossier-close" aria-label="Close">×</button>
  <div id="dossier-content"></div>
</aside>

<nav class="rail" id="rail" aria-label="Colour the map by"></nav>

<script>
/* Surface failures instead of leaving "loading courses…" on screen forever.
   A silent boot failure is indistinguishable from a slow network. */
window.addEventListener("error", function (e) {
  var b = document.getElementById("boot");
  if (b && !b.hidden) b.textContent = (e.message || "script error") + " — " + ((e.filename || "").split("/").pop() || "?") + ":" + (e.lineno || "?");
});
window.addEventListener("unhandledrejection", function (e) {
  var b = document.getElementById("boot");
  if (b && !b.hidden) b.textContent = "unhandled: " + ((e.reason && e.reason.message) || e.reason);
});

/* The header's theme toggle — a vanilla replica of app/theme-toggle.tsx.
   Same three states, same glyphs, same localStorage key, so the choice made
   here follows you back into the app and vice versa. */
(function () {
  var ORDER = ["light", "dark", "auto"];
  var LABEL = { light: "Day", dark: "Dusk", auto: "Auto" };
  var TITLE = {
    light: "Light. Click for dark.",
    dark: "Dark. Click to follow the system.",
    auto: "Following the system. Click for light.",
  };
  var GLYPH = {
    light: '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="3.4" fill="currentColor"/></svg>',
    dark: '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M7.6 6.6A3.9 3.9 0 0 1 3.4 1.1a4 4 0 1 0 4.2 5.5Z" fill="currentColor"/></svg>',
    auto: '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><circle cx="5" cy="5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 1.6a3.4 3.4 0 0 1 0 6.8Z" fill="currentColor"/></svg>',
  };
  var btn = document.getElementById("theme-toggle");
  if (!btn) return;
  var theme = "light";
  try {
    var t = localStorage.getItem("theme");
    if (ORDER.indexOf(t) >= 0) theme = t;
  } catch (e) { /* private browsing */ }
  function render() {
    btn.innerHTML = GLYPH[theme] + LABEL[theme];
    btn.title = TITLE[theme];
    btn.setAttribute("aria-label", "Theme: " + LABEL[theme] + ". " + TITLE[theme]);
  }
  btn.addEventListener("click", function () {
    theme = ORDER[(ORDER.indexOf(theme) + 1) % ORDER.length];
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem("theme", theme); } catch (e) { /* ditto */ }
    render();
  });
  render();
})();
</script>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="/courses/src/shared.js"></script>
<script src="/courses/src/panel.js"></script>
<script src="/courses/src/list.js"></script>
<script src="/courses/src/course.js"></script>
<script src="/courses/src/map.js"></script>
</body>
</html>
